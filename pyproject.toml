[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-ddc-brightness"
version = "0.1.0"
description = "External display brightness controls and a COSMIC-friendly popup"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cosmic-ddc-brightness contributors" }]
keywords = ["COSMIC", "Pop!_OS", "ddcutil", "GeekMagic", "brightness", "monitor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
cosmic-ddc-brightness = "cosmic_ddc_brightness.cli:main"

[project.urls]
Source = "https://github.com/midho/cosmic-ddc-brightness"
Issues = "https://github.com/midho/cosmic-ddc-brightness/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
