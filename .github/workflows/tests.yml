name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: PYTHONPATH=src python -X dev -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Check shell scripts
        run: bash -n install.sh uninstall.sh scripts/cosmic-ddc-brightness
      - name: Build package
        run: |
          python -m pip install build
          python -m build
